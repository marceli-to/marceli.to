<footer class="bg-snow/50 lg:bg-transparent w-full fixed bottom-0 left-0 z-40 px-15 sm:px-20 py-10 text-xs md:text-sm leading-[1.35] flex sm:gap-y-16 items-end justify-between">
  <div>
    {{ contact_information:name }}<br>
    {{ contact_information:address | nl2br }}
  </div>
  <div>
    <a 
      href="tel:{{ contact_information:phone }}"
      class="block text-raspberry no-underline hover:underline underline-offset-4 decoration-1">

    <a 
      href="mailto:{{ contact_information:email }}"

      {{ contact_information:email }}
    </a>
  </div>
</footer>
